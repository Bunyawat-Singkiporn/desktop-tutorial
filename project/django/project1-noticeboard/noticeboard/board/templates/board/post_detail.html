{% extends 'board/base.html' %}
{% block title %}{{ post.title }}{% endblock %}

{% block content %}
    <a href="{% url 'post_list' %}" class="text-blue-600 hover:underline text-sm">
        ← Back to all posts
    </a>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mt-4">
        <h1 class="text-2xl font-bold text-gray-800">{{ post.title }}</h1>
        <p class="text-gray-400 text-sm mt-1">
            Posted {{ post.created_at|date:"M d, Y · H:i" }}
        </p>

        <hr class="my-5 border-gray-200">

        <p class="text-gray-700 leading-relaxed whitespace-pre-wrap">{{ post.content }}</p>

        <div class="mt-8 flex gap-3">
            <a href="{% url 'post_update' post.pk %}"
               class="bg-yellow-400 text-white px-4 py-2 rounded hover:bg-yellow-500 text-sm font-medium transition">
                ✏️ Edit
            </a>
            <a href="{% url 'post_delete' post.pk %}"
               class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 text-sm font-medium transition">
                🗑️ Delete
            </a>
        </div>
    </div>
{% endblock %}
