<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Notice Board{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow px-6 py-4 flex justify-between items-center">
        <a href="{% url 'post_list' %}" class="text-xl font-bold text-blue-600">
            📋 Notice Board
        </a>
        <a href="{% url 'post_create' %}"
           class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 text-sm font-medium transition">
            + New Post
        </a>
    </nav>

    <main class="max-w-3xl mx-auto mt-8 px-4 pb-12">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
